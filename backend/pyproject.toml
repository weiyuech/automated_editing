[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-video-editing-backend"
version = "0.1.1"
description = "Python backend for robot-assisted automated video editing"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "websockets>=12",
  "numpy>=1.26,<2.3",
  "opencv-python-headless>=4.9",
  "scenedetect[opencv]>=0.6.4",
  # PySceneDetect's OpenCV backend answers NaN when asked a video's position in milliseconds,
  # which kills its decode thread on every file tried here. PyAV reads timestamps from the
  # container instead, and is what makes scene detection run at all.
  "av>=12"
]

[project.optional-dependencies]
beat = [
  "librosa==0.11.0",
  "numba==0.61.2",
  "llvmlite==0.44.0"
]

# Needed only by scripts/prepare_assets.py, never at runtime. It pins the bundled variable fonts
# to a single weight: Google ships Noto Sans SC and Noto Serif SC with the lightest weight as the
# default instance, libass does not instance variable fonts, and Thin text over footage cannot be
# read. Listed rather than installed ad hoc so the environment stays reproducible.
assets = [
  "fonttools>=4.50",
  "brotli>=1.1"
]

dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
