[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-video-editing-backend"
version = "0.1.20"
description = "Python backend for controlled robot capture and precise video concatenation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.41",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "websockets>=12",
  "numpy>=1.26",
  "librosa>=0.11,<0.12",
  "onnxruntime>=1.18",
  "tokenizers>=0.19",
]

[project.optional-dependencies]
# Needed only by scripts/prepare_assets.py, never at runtime. It pins the bundled variable fonts
# to a single weight: Google ships Noto Sans SC and Noto Serif SC with the lightest weight as the
# default instance, libass does not instance variable fonts, and Thin text over footage cannot be
# read. Listed rather than installed ad hoc so the environment stays reproducible.
assets = [
  "fonttools>=4.50",
  "brotli>=1.1"
]

dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Preserve this project's established correctness checks across Ruff default changes.
select = ["E4", "E7", "E9", "F"]
