    <circle cx="420" cy="463" r="45" fill="white"/>
    <circle cx="604" cy="463" r="45" fill="white"/>
    <path d="M482 562Q512 597 542 562" fill="none" stroke="white" stroke-width="15" stroke-linecap="round"/>
