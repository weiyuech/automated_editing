    <circle cx="512" cy="93" r="40" fill="url(#robot-blue)"/>
    <rect x="432" y="173" width="160" height="43" rx="21.5" fill="url(#robot-blue)"/>

    <rect x="73" y="568" width="205" height="372" rx="102.5" fill="url(#robot-blue)"/>
    <rect x="746" y="568" width="205" height="372" rx="102.5" fill="url(#robot-blue)"/>
    <rect x="242" y="697" width="540" height="74" rx="37" fill="#4D5AF0"/>

    <path d="M512 201C250 201 180 281 180 501C180 721 250 801 512 801C774 801 844 721 844 501C844 281 774 201 512 201Z"
          fill="url(#robot-blue)"/>
    <path d="M512 201C250 201 180 281 180 501C180 721 250 801 512 801C774 801 844 721 844 501C844 281 774 201 512 201Z"
