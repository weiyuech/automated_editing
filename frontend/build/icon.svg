<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="robot-blue" x1="210" y1="120" x2="790" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A9B8FF"/>
      <stop offset="0.42" stop-color="#6E7DFF"/>
      <stop offset="1" stop-color="#3038F5"/>
    </linearGradient>
    <linearGradient id="robot-blue-dark" x1="330" y1="330" x2="700" y2="710" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5E71FF"/>
      <stop offset="1" stop-color="#2833DC"/>
    </linearGradient>
    <radialGradient id="soft-light" cx="0" cy="0" r="1" gradientTransform="translate(355 265) rotate(48) scale(560 500)" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.34"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-shadow" x="28" y="28" width="968" height="970" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#2431C7" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#soft-shadow)">
    <!-- Reuses the minimalist robot's antenna, rounded head, face and wheel geometry. -->
