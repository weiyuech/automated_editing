name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"
      - "release/**"

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # pnpm 11 uses Node's built-in SQLite store and therefore requires Node >=22.13.
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Reject tracked credentials
        run: python scripts/check_release_secrets.py

      - name: Test standalone robot console
        run: node --test tools/tests/robot-control-console.test.mjs

      - name: Install backend build dependencies
        run: python -m pip install --upgrade pip pyinstaller && python -m pip install -e "backend[assets,dev]"

      - name: Fetch pinned fonts, BAAI model and Windows FFmpeg
        run: python scripts/prepare_assets.py --platform win64

      - name: Verify bundled media assets
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              Path("backend/vendor/ffmpeg/win64/ffmpeg.exe"),
              Path("backend/vendor/ffmpeg/win64/ffprobe.exe"),
              Path("backend/src/automated_video_editing_backend/assets/fonts/NotoSansSC.ttf"),
              Path("backend/src/automated_video_editing_backend/assets/fonts/NotoSerifSC.ttf"),
              Path("backend/src/automated_video_editing_backend/assets/fonts/SmileySans.ttf"),
              Path("backend/src/automated_video_editing_backend/assets/semantic/bge-small-zh-v1.5/model_int8.onnx"),
              Path("backend/src/automated_video_editing_backend/assets/semantic/bge-small-zh-v1.5/tokenizer.json"),
              Path("backend/src/automated_video_editing_backend/assets/semantic/bge-small-zh-v1.5/LICENSE-BAAI-BGE.txt"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit("Missing release assets: " + ", ".join(missing))
          print("Fonts and FFmpeg are ready.")
          PY

      - name: Add bundled FFmpeg tools to PATH
        run: echo "$GITHUB_WORKSPACE/backend/vendor/ffmpeg/win64" >> "$GITHUB_PATH"

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Freeze Python backend
        run: python -m PyInstaller --noconfirm --clean --distpath frontend/build --workpath .cache/pyinstaller backend/windows_backend.spec

      - name: Verify frozen backend contents
        run: |
          python - <<'PY'
          from pathlib import Path

          bundle = Path("frontend/build/backend-dist")
          required_names = {
              "automated-video-editing-backend.exe",
              "ffmpeg.exe",
              "ffprobe.exe",
              "NotoSansSC.ttf",
              "NotoSerifSC.ttf",
              "SmileySans.ttf",
              "model_int8.onnx",
              "tokenizer.json",
              "LICENSE-BAAI-BGE.txt",
          }
          found = {path.name for path in bundle.rglob("*") if path.is_file()}
          missing = sorted(required_names - found)
          if missing:
              raise SystemExit("Frozen backend is incomplete: " + ", ".join(missing))
          print("Frozen backend contains the executable, FFmpeg, fonts.")
          PY

      - name: Smoke-test frozen backend startup and API authentication
        run: python scripts/smoke_frozen_backend.py frontend/build/backend-dist/automated-video-editing-backend.exe

      - name: Exercise bundled media and model runtimes without downloads
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          unset FFMPEG_BIN FFPROBE_BIN
          frontend/build/backend-dist/automated-video-editing-backend.exe --check-bundled-runtime

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Test Electron policies and robot diagnostics
        working-directory: frontend
        run: pnpm run test:main

      - name: Build Windows installer
        working-directory: frontend
        run: pnpm run dist:win

      - name: Create SHA-256 checksum
        run: |
          cd release
          sha256sum *.exe > SHA256SUMS.txt

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: automated-video-editing-windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish public Windows installer
        if: github.ref == 'refs/heads/codex/motion-trim-retry-20260925'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.16 \
            release/Automated-Video-Editing-0.1.16-Windows-x64-Setup.exe \
            release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "自动视频剪辑 0.1.16" \
            --notes "完整 Windows 安装包，包含运行所需的后端、媒体工具、字体和本地模型。本版在云台心跳中记录变焦倍率，按实际运动裁剪每个镜头的静止头尾并标注为“准备”（自动与手动组合默认均不包含）；到位未确认时按停稳与容差重发（首点原点唤醒最多 6 次、其余最多 4 次）。"

  package-external-media-tools:
    name: Package Windows x64 — external media tools
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate diagnostics script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          $scriptPath = (Resolve-Path "scripts/Collect-AVE-RobotDiagnostics.ps1").Path
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $scriptPath,
            [ref]$tokens,
            [ref]$parseErrors
          )
          if ($parseErrors.Count -gt 0) {
            $messages = $parseErrors | ForEach-Object { $_.Message }
            throw "PowerShell parser errors:`n$($messages -join "`n")"
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Reject tracked credentials
        run: python scripts/check_release_secrets.py

      - name: Test standalone robot console
        run: node --test tools/tests/robot-control-console.test.mjs

      - name: Install backend with external media tools
        run: python -m pip install --upgrade pip pyinstaller && python -m pip install -e "backend[assets,dev]"

      - name: Fetch fonts and the BAAI model
        run: |
          python scripts/prepare_assets.py --fonts-only
          python scripts/prepare_assets.py --semantic-only

      - name: Fetch pinned FFmpeg for tests only
        run: python scripts/prepare_assets.py --platform win64 --ffmpeg-only

      - name: Add test-only FFmpeg to PATH
        run: echo "$GITHUB_WORKSPACE/backend/vendor/ffmpeg/win64" >> "$GITHUB_PATH"

      - name: Verify retained runtime assets
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              Path("backend/src/automated_video_editing_backend/assets/fonts/NotoSansSC.ttf"),
              Path("backend/src/automated_video_editing_backend/assets/fonts/NotoSerifSC.ttf"),
              Path("backend/src/automated_video_editing_backend/assets/fonts/SmileySans.ttf"),
              Path("backend/src/automated_video_editing_backend/assets/semantic/bge-small-zh-v1.5/model_int8.onnx"),
              Path("backend/src/automated_video_editing_backend/assets/semantic/bge-small-zh-v1.5/tokenizer.json"),
              Path("backend/src/automated_video_editing_backend/assets/semantic/bge-small-zh-v1.5/LICENSE-BAAI-BGE.txt"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit("Missing release assets: " + ", ".join(missing))
          print("Fonts are ready for the frozen runtime.")
          PY

      - name: Run backend tests with external media tools
        env:
          AVE_EXTERNAL_MEDIA_TOOLS: "1"
        run: python -m pytest backend/tests -q

      - name: Freeze backend with external media tools or standalone FFmpeg
        env:
          AVE_EXTERNAL_MEDIA_TOOLS: "1"
        run: python -m PyInstaller --noconfirm --clean --distpath frontend/build-external --workpath .cache/pyinstaller-external backend/windows_backend.spec

      - name: Audit external-tools backend contents
        run: |
          python - <<'PY'
          from pathlib import Path

          bundle = Path("frontend/build-external/backend-dist")
          required_names = {
              "automated-video-editing-backend.exe",
              "NotoSansSC.ttf",
              "NotoSerifSC.ttf",
              "SmileySans.ttf",
              "model_int8.onnx",
              "tokenizer.json",
              "LICENSE-BAAI-BGE.txt",
          }
          files = [path for path in bundle.rglob("*") if path.is_file()]
          found = {path.name for path in files}
          missing = sorted(required_names - found)
          if missing:
              raise SystemExit("Frozen backend is incomplete: " + ", ".join(missing))
          print(f"External backend contains every required runtime asset ({len(files)} files).")
          PY
          python scripts/audit_external_bundle.py frontend/build-external/backend-dist

      - name: Smoke-test external-tools backend startup and API authentication
        env:
          AVE_EXTERNAL_MEDIA_TOOLS: "1"
        run: python scripts/smoke_frozen_backend.py frontend/build-external/backend-dist/automated-video-editing-backend.exe

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Test Electron policies and robot diagnostics
        working-directory: frontend
        run: pnpm run test:main

      - name: Build external-media-tools installer
        working-directory: frontend
        run: pnpm run dist:win:external

      - name: Create SHA-256 checksum
        run: |
          cd release/external-media-tools
          sha256sum *.exe > SHA256SUMS.txt

      - name: Upload external-media-tools installer
        uses: actions/upload-artifact@v4
        with:
          name: automated-video-editing-windows-x64-external-media-tools
          path: |
            release/external-media-tools/*.exe
            release/external-media-tools/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
