name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Reject tracked credentials
        run: python scripts/check_release_secrets.py

      - name: Install backend build dependencies
        run: python -m pip install --upgrade pip pyinstaller && python -m pip install -e "backend[beat,assets,dev]"

      - name: Fetch pinned fonts and Windows FFmpeg
        run: python scripts/prepare_assets.py --platform win64

      - name: Verify bundled media assets
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              Path("backend/vendor/ffmpeg/win64/ffmpeg.exe"),
              Path("backend/src/automated_video_editing_backend/assets/fonts/NotoSansSC.ttf"),
              Path("backend/src/automated_video_editing_backend/assets/fonts/NotoSerifSC.ttf"),
              Path("backend/src/automated_video_editing_backend/assets/fonts/SmileySans.ttf"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit("Missing release assets: " + ", ".join(missing))
          print("Fonts and FFmpeg are ready.")
          PY

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Freeze Python backend
        run: python -m PyInstaller --noconfirm --clean --distpath frontend/build --workpath .cache/pyinstaller backend/windows_backend.spec

      - name: Verify frozen backend contents
        run: |
          python - <<'PY'
          from pathlib import Path

          bundle = Path("frontend/build/backend-dist")
          required_names = {
              "automated-video-editing-backend.exe",
              "ffmpeg.exe",
              "NotoSansSC.ttf",
              "NotoSerifSC.ttf",
              "SmileySans.ttf",
          }
          found = {path.name for path in bundle.rglob("*") if path.is_file()}
          missing = sorted(required_names - found)
          if missing:
              raise SystemExit("Frozen backend is incomplete: " + ", ".join(missing))
          print("Frozen backend contains the executable, FFmpeg, and all fonts.")
          PY

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        working-directory: frontend
        run: pnpm run dist:win

      - name: Create SHA-256 checksum
        run: |
          cd release
          sha256sum *.exe > SHA256SUMS.txt

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: automated-video-editing-windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
